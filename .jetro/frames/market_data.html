<!DOCTYPE html>
<html>
<head>
<style>
  body {
    background-color: #0a0a0a;
    color: #e5e7eb;
    font-family: 'JetBrains Mono', monospace, sans-serif;
    margin: 0;
    padding: 16px;
  }
  .card {
    border: 1px solid #262626;
    border-radius: 8px;
    padding: 16px;
    background: #171717;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    border-bottom: 1px solid #262626;
    padding-bottom: 12px;
  }
  .ticker { font-size: 20px; font-weight: bold; color: #3b82f6; }
  .price { font-size: 24px; font-weight: bold; color: #10b981; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .stat {
    display: flex;
    flex-direction: column;
  }
  .label { font-size: 11px; color: #737373; text-transform: uppercase; }
  .value { font-size: 14px; font-weight: 500; }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="ticker" id="ticker">RELIANCE.NS</div>
      <div class="price" id="price">₹1322.7</div>
    </div>
    <div class="grid">
      <div class="stat">
        <span class="label">Day High</span>
        <span class="value" id="dayHigh">₹1344.0</span>
      </div>
      <div class="stat">
        <span class="label">Day Low</span>
        <span class="value" id="dayLow">₹1318.4</span>
      </div>
      <div class="stat">
        <span class="label">52W High</span>
        <span class="value" id="yearHigh">₹1611.8</span>
      </div>
      <div class="stat">
        <span class="label">52W Low</span>
        <span class="value" id="yearLow">₹1290.0</span>
      </div>
      <div class="stat">
        <span class="label">Volume</span>
        <span class="value" id="volume">21,660,577</span>
      </div>
    </div>
  </div>
</body>
</html>
