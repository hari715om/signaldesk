    margin: 0;
    padding: 16px;
    box-sizing: border-box;
    height: 100vh;
    border: 1px solid #262626;
    border-radius: 8px;
    overflow: hidden;
  }
  .header {
    font-size: 16px;
    font-weight: bold;
    color: #e5e7eb;
    margin-bottom: 24px;
    padding-bottom: 12px;
    border-bottom: 1px solid #262626;
  }
  .chart-container {
    position: relative;
    width: 650px;
    height: 180px;
    margin-left: 40px;
    border-left: 1px solid #262626;
    border-bottom: 1px solid #262626;
  }
  .y-label {
    position: absolute;
    left: -40px;
    font-size: 12px;
    color: #737373;
  }
  .top-label { top: -6px; }
  .mid-label { top: calc(50% - 6px); }
  .bot-label { bottom: -6px; }
</style>
