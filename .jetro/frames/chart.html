<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>
  body {
    background-color: #0a0a0a;
    color: #e5e7eb;
    font-family: 'JetBrains Mono', monospace, sans-serif;
    margin: 0;
    padding: 16px;
  }
  .card {
    border: 1px solid #262626;
    border-radius: 8px;
    padding: 16px;
    background: #171717;
    height: calc(100vh - 32px);
    box-sizing: border-box;
  }
  #chart {
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
  <div class="card">
    <div id="chart"></div>
  </div>

  <script>
    const dates = [
      "2026-04-06", "2026-04-07", "2026-04-08", "2026-04-09", "2026-04-10", 
      "2026-04-13", "2026-04-15", "2026-04-16", "2026-04-17", "2026-04-20", 
      "2026-04-21", "2026-04-22", "2026-04-23", "2026-04-24", "2026-04-27", 
      "2026-04-28", "2026-04-29", "2026-04-30", "2026-05-04", "2026-05-05", 
      "2026-05-06", "2026-05-07", "2026-05-08", "2026-05-11", "2026-05-12", 
      "2026-05-13", "2026-05-14", "2026-05-15", "2026-05-18", "2026-05-19"
    ];
    const closes = [
      1304.7, 1304.6, 1347.8, 1330, 1350.2, 1315.1, 1344.1, 1343.3, 1365, 1363.3,
      1353.3, 1362.1, 1343.4, 1327.8, 1365.8, 1388.9, 1425.4, 1430.8, 1463.1, 1463.6,
      1437.9, 1436.2, 1435.2, 1388.2, 1364, 1358.8, 1361.8, 1336.4, 1335.9, 1322.7
    ];

    const trace = {
      x: dates,
      y: closes,
      type: 'scatter',
      mode: 'lines',
      name: 'RELIANCE.NS',
      line: { color: '#10b981', width: 2 },
      fill: 'tozeroy',
      fillcolor: 'rgba(16, 185, 129, 0.1)'
    };

    const layout = {
      title: {
        text: 'PRICE HISTORY — RELIANCE.NS',
        font: { color: '#e5e7eb', size: 16 }
      },
      paper_bgcolor: 'rgba(0,0,0,0)',
      plot_bgcolor: 'rgba(0,0,0,0)',
      font: { color: '#737373', family: 'JetBrains Mono' },
      xaxis: { 
        gridcolor: '#262626',
        zerolinecolor: '#262626',
        showticklabels: false
      },
      yaxis: { 
        gridcolor: '#262626',
        zerolinecolor: '#262626',
        tickprefix: '₹'
      },
      margin: { l: 50, r: 20, t: 40, b: 20 }
    };

    const config = { responsive: true, displayModeBar: false };
    Plotly.newPlot('chart', [trace], layout, config);
  </script>
</body>
</html>
