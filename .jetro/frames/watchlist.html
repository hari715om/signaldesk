<!DOCTYPE html>
<html>
<head>
<style>
  body {
    background-color: #0a0a0a;
    color: #e5e7eb;
    font-family: 'JetBrains Mono', monospace, sans-serif;
    margin: 0;
    padding: 16px;
  }
  .card {
    border: 1px solid #262626;
    border-radius: 8px;
    padding: 16px;
    background: #171717;
  }
  .header {
    margin-bottom: 16px;
    border-bottom: 1px solid #262626;
    padding-bottom: 12px;
    font-size: 16px;
    font-weight: bold;
    color: #a855f7;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  th {
    text-align: left;
    color: #737373;
    font-weight: 500;
    padding-bottom: 8px;
    border-bottom: 1px solid #262626;
  }
  td {
    padding: 12px 0;
    border-bottom: 1px solid #262626;
  }
  tr:last-child td {
    border-bottom: none;
  }
  .ticker { font-weight: bold; color: #3b82f6; }
  .score { color: #10b981; font-weight: bold; }
  .verdict { 
    background: rgba(16, 185, 129, 0.1); 
    color: #10b981; 
    padding: 2px 6px; 
    border-radius: 4px;
    font-size: 12px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>
      WATCHLIST RANKING
    </div>
    <table>
      <thead>
        <tr>
          <th>Ticker</th>
          <th>Score</th>
          <th>Verdict</th>
          <th>Consensus</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="ticker">HDFCBANK.NS</td>
          <td class="score">76.8</td>
          <td><span class="verdict">BUY</span></td>
          <td>Quant</td>
        </tr>
        <tr>
          <td class="ticker">RELIANCE.NS</td>
          <td class="score">71.8</td>
          <td><span class="verdict">BUY</span></td>
          <td>Quant</td>
        </tr>
        <tr>
          <td class="ticker">INFY.NS</td>
          <td class="score">70.5</td>
          <td><span class="verdict">BUY</span></td>
          <td>Quant</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
